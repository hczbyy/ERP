<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenERP 企业资源管理系统</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- ============ 登录页 ============ -->
  <div id="login-view" class="login-view hidden">
    <div class="login-card">
      <div class="login-logo">OE</div>
      <h1 class="login-title">OpenERP 企业资源管理系统</h1>
      <p class="login-sub">采购 · 销售 · 库存 · 财务 一体化管理平台</p>
      <form id="login-form" autocomplete="off">
        <div class="field">
          <label>账号</label>
          <input type="text" id="login-username" placeholder="请输入账号" required>
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" id="login-password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">登 录</button>
      </form>
      <div class="login-tips">
        <p>演示账号（密码见提示）：</p>
        <div class="tip-chips">
          <span class="chip" data-u="admin" data-p="admin123">admin / admin123（超级管理员）</span>
          <span class="chip" data-u="purchaser" data-p="demo123">采购经理</span>
          <span class="chip" data-u="sales" data-p="demo123">销售经理</span>
          <span class="chip" data-u="keeper" data-p="demo123">仓管员</span>
          <span class="chip" data-u="finance" data-p="demo123">财务专员</span>
          <span class="chip" data-u="auditor" data-p="demo123">审计员</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 主应用 ============ -->
  <div id="app-view" class="app-view hidden">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-badge">OE</div>
        <span>OpenERP</span>
      </div>
      <nav id="menu" class="menu"></nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="page-title" id="page-title">工作台</div>
        <div class="topbar-right">
          <span class="topbar-user" id="topbar-user"></span>
          <button class="btn btn-ghost btn-sm" onclick="ERP.changePassword()">修改密码</button>
          <button class="btn btn-ghost btn-sm" onclick="ERP.logout()">退出</button>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- 模态框容器 -->
  <div id="modal-root"></div>
  <!-- Toast 容器 -->
  <div id="toast-root"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/master.js"></script>
  <script src="js/pages/purchase.js"></script>
  <script src="js/pages/sales.js"></script>
  <script src="js/pages/inventory.js"></script>
  <script src="js/pages/finance.js"></script>
  <script src="js/pages/system.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
